name: makosh-native-dev
services:
  postgres:
    # PostgreSQL 18 with the pgvector extension for the AI index (PostgreSQL License).
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      POSTGRES_DB: makosh
      POSTGRES_USER: makosh
      POSTGRES_PASSWORD: ${MAKOSH_POSTGRES_PASSWORD:?Run scripts/dev-db.sh up}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makosh -d makosh"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  pgbouncer:
    build:
      context: ./scripts/pgbouncer
    image: makosh-pgbouncer:1.24.1-deb13u2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:55441:6432"
    volumes:
      - ./.local/pgbouncer-users.txt:/run/makosh-pgbouncer-users.txt:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "makosh", "-d", "makosh"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/bin/sh", "/run/makosh-seaweed-entrypoint.sh"]
    user: "0:0"
    ports:
      - "127.0.0.1:55440:8333"
    volumes:
      - s3-data:/data
      - ./.local/s3-identities.json:/run/makosh-s3-identities.json:ro
      - ./scripts/seaweed-entrypoint.sh:/run/makosh-seaweed-entrypoint.sh:ro
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "SETUID", "SETGID"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
  s3-data:
