[databases]
makosh = host=postgres port=5432 dbname=makosh

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /tmp/makosh-pgbouncer-users.txt
; Makosh leases and SET state belong to a session, never to a transaction.
pool_mode = session
server_reset_query = DISCARD ALL
server_reset_query_always = 0
max_client_conn = 200
; Budget: default + reserve = 90 of PostgreSQL max_connections = 100, leaving
; 10 backends for direct diagnostic sessions on 127.0.0.1:55439.
; scripts/test-dev-db-config.py guards this sum.
default_pool_size = 80
reserve_pool_size = 10
reserve_pool_timeout = 1
query_wait_timeout = 15
server_connect_timeout = 5
log_connections = 0
log_disconnections = 0
log_pooler_errors = 0
stats_period = 0
